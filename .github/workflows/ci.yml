name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  RUSTFLAGS: -Dwarnings
  LINUX_APT_DEPS: libdbus-1-dev libglib2.0-dev pkg-config libgtk-3-dev libssl-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev nasm

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      # Not `mise install --force rust` on macOS: the image's rustup comes from
      # Homebrew, and mise's forced reinstall runs a hardcoded
      # `~/.cargo/bin/rustup`, which doesn't exist there.
      - name: Install Rust
        run: ${{ runner.os == 'macOS' && 'rustup component add rustfmt clippy' || 'mise install --force rust' }}
      - run: mise install --force cargo-binstall cargo:cargo-nextest cargo:cargo-deny node pnpm
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_APT_DEPS
      - run: mise run verify

  check-ios:
    name: Check (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      # See the verify job: mise's forced Rust reinstall fails on macOS.
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:check-ios

  check-android:
    name: Check (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise install --force rust cargo-binstall cargo:cargo-ndk java android-sdk
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_APT_DEPS
      - run: mise run ci:check-android
